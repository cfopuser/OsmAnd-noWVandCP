name: Upstream Sync, Kiosk Verification & Automated Build

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release?'
        required: true
        type: boolean
        default: true
      flavor:
        description: 'Gradle build task (e.g. assembleAndroidFullLegacyFatDebug, assembleAndroidFullOpenglArm64Release)'
        required: true
        type: string
        default: 'assembleAndroidFullLegacyFatDebug'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OsmAnd Fork
        uses: actions/checkout@v4
        with:
          path: android
          fetch-depth: 0

      - name: Checkout OsmAnd-resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd-core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd-core-legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd-build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd-tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd-misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Kiosk & Security Invariants
        working-directory: ./android
        run: |
          chmod +x scripts/verify_kiosk_invariants.sh
          ./scripts/verify_kiosk_invariants.sh

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Configure Gradle Memory & Cache
        working-directory: ./android
        run: |
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n" >> gradle.properties

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          BUILD_TASK="${{ inputs.flavor || 'assembleAndroidFullLegacyFatDebug' }}"
          echo "Running build task: $BUILD_TASK"
          ./gradlew $BUILD_TASK

      - name: Collect, Rename, and Generate Checksums for APKs
        id: collect_apks
        working-directory: ./android
        run: |
          mkdir -p release_apks
          find OsmAnd/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          cd release_apks
          # Generate checksums for scripts/downstream verification
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== Collected Release Artifacts ==="
          ls -lah .
          cd ..
          TAG_NAME="kiosk-$(date +'%Y.%m.%d-%H%M')-$(git log -n 1 --format='%h')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osmand-kiosk-apks
          path: |
            android/release_apks/*.apk
            android/release_apks/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ (inputs.publish_release != false) && (steps.collect_apks.outcome == 'success') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect_apks.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: OsmAnd Kiosk Edition ${{ steps.collect_apks.outputs.tag_name }}
          body: |
            ## OsmAnd Kiosk & SSL Packet Inspection Edition
            **Edited by cfopuser**

            Automated CI/CD release build.
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            ### Features:
            - **Kiosk Mode**: WebViews and external browser breakouts disabled across menus, settings, and dialogs.
            - **SSL Packet Inspection**: Android Network Security Config enabled with User + System CA trust and zero certificate pinning.
            - **3D OpenGL & Offline Navigation**: Full features supported.

            ### Assets:
            Download the APK files below. Downstream scripts can verify integrity using `SHA256SUMS.txt`.
          files: |
            android/release_apks/*.apk
            android/release_apks/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
